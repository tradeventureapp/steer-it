<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Steer It — Controller</title>
    <!-- Session-bound view (needs a live join code) — keep it out of the index so it
         never competes with or dilutes the landing page. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0518" />
    <!-- Retro-arcade display font (graceful fallback to system if offline). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="phone">
    <!-- Debug strip stays outside the rotated stage so it lives in real
         viewport coords. -->
    <div id="debug">init</div>

    <!-- All controller UI lives inside #phone-stage. The stage is sized
         to the screen's LANDSCAPE rectangle (100vmax × 100vmin) and
         JS-rotated to whatever angle keeps it visually upright in the
         player's view, based on the gravity vector. The player always
         sees landscape regardless of what iOS Safari reports. -->
    <div id="phone-stage">
      <div id="lobby-slot" hidden>JOINING…</div>
      <input
        id="lobby-name"
        type="text"
        maxlength="12"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        enterkeyhint="done"
        placeholder="YOUR NAME"
        hidden
      />
      <button id="unlock" type="button">TAP TO STEER</button>
      <div id="lobby-colors" hidden></div>

      <!-- STEERBALL team picker (shown only in Steerball, before kickoff). The player MUST pick a
           side before they can unlock the wheel; a FULL side (4) is disabled. Free to change until
           the host starts the match, then locked. Wired in phone.ts. -->
      <div id="team-picker" hidden>
        <div id="team-picker-title">PICK YOUR TEAM</div>
        <div id="team-buttons">
          <button id="team-left" type="button" class="team-btn team-left">
            <span class="team-btn-name">BLUE</span><span class="team-btn-count"></span>
          </button>
          <button id="team-right" type="button" class="team-btn team-right">
            <span class="team-btn-name">ORANGE</span><span class="team-btn-count"></span>
          </button>
        </div>
        <div id="team-picker-hint">Pick a side to start.</div>
      </div>

      <!-- RECENTER — opt-in steering rescue (top-centre, clear of the side pedals + the
           bottom E-BRAKE). Visible while driving but deliberately understated: it's a fix
           for a mis-mapped device, not a primary control. Wired in phone.ts (recenter()). -->
      <button id="recenter" type="button" hidden aria-label="Recenter steering">RECENTER</button>

      <!-- STEERBALL identity chip (driving screen): your team colour + number, so you can spot
           YOUR car on the shared monitor. Tappable BEFORE kickoff to switch sides. -->
      <button id="team-ident" type="button" hidden>
        <span id="team-ident-badge"></span><span id="team-ident-label"></span>
      </button>

      <div id="pedals" hidden>
        <button id="pedal-brake" class="pedal" type="button" aria-label="Brake">
          <div class="pedal-fill"></div>
          <div class="pedal-saturation"></div>
          <span class="pedal-label">BRAKE</span>
        </button>
        <button id="pedal-throttle" class="pedal" type="button" aria-label="Throttle">
          <div class="pedal-fill"></div>
          <div class="pedal-saturation"></div>
          <span class="pedal-label">GAS</span>
        </button>
        <button id="handbrake" type="button" aria-label="Handbrake">
          <span class="pedal-label">E-BRAKE</span>
        </button>
      </div>

      <div id="error" hidden></div>
    </div>

    <script type="module" src="/src/phone.ts"></script>
  </body>
</html>
